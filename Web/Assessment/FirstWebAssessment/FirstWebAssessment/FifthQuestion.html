<!DOCTYPE html>
<html>
<head>
    <title>Background for h1</title>
</head>

<body>

    <div>
        <h1>Welcome to </h1>
        <h1>JavaScript Learning</h1>
    </div>

    <h1>It is Very Easy to Learn</h1>

    <script>

        let headings = document.querySelectorAll("div h1");

        for (let i = 0; i < headings.length; i++) {

            headings[i].style.backgroundColor = "yellow";

        }

    </script>

</body>
</html>
