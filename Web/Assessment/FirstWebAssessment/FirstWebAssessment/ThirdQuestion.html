<!DOCTYPE html>
<html>
<head>
    <title>Button Click Event</title>
</head>

<body>

    <button id="btnClick">Click Me</button>

    <script>

        let button = document.getElementById("btnClick");

        button.addEventListener("click", function () {

            console.log("Button was clicked!");

            alert("Button was clicked!");

        });

    </script>

</body>
</html>
