<!DOCTYPE html>
<html>
<head>
    <title>Add Index to List</title>

    <script src="https://ajax.aspnetcdn.com/ajax/jquery/jquery-3.4.1.min.js"></script>

    <script>

        $(document).ready(function () {

            $("li").each(function (index) {

                $(this).prepend(index + " ");

            });

        });

    </script>

</head>

<body>

    <ul>

        <li>CSHARP</li>

        <li>SQL</li>

        <li>ADO</li>

    </ul>

</body>
</html>
