<!DOCTYPE html>
<html>
<head>
    <title>Hide Odd Rows</title>
</head>

<body>

    <table>

        <tr>
            <th>ID</th>
            <th>Name</th>
        </tr>

        <tr>
            <td>1</td>
            <td>Giri</td>
        </tr>

        <tr>
            <td>2</td>
            <td>Rahul</td>
        </tr>

        <tr>
            <td>3</td>
            <td>Arun</td>
        </tr>

        <tr>
            <td>4</td>
            <td>Kiran</td>
        </tr>

    </table>

    <script>

        let rows = document.querySelectorAll("tr");

        for (let i = 0; i < rows.length; i++) {

            if (i % 2 != 0) {

                rows[i].style.display = "none";

            }

        }

    </script>

</body>
</html>
